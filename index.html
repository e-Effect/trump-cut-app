<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>True Cut</title>
  <meta name="theme-color" content="#111827" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      background: #f9fafb;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.08);
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 1.4rem;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .version {
      font-size: 0.75rem;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .header h1 {
      margin: 0;
    }
    .grid {
      display: grid;
      gap: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    textarea, input, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: #ffffff;
    }
    textarea {
      min-height: 190px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .card-picker {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      background: #ffffff;
    }
    .picker-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .picker-row.suit-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .picker-row.rank-row-5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .picker-row.rank-row-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      max-width: 62%;
    }
    .picker-row:last-child {
      margin-bottom: 0;
    }
    .pick-btn {
      min-width: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pick-btn.suit-btn {
      min-height: 52px;
      font-size: 1.45rem;
      padding: 10px 0;
    }
    .pick-btn.active {
      background: #e0e7ff;
      border-color: #6366f1;
      color: #312e81;
    }
    .pick-btn.red {
      color: #dc2626;
    }
    .card-chip {
      margin-top: 8px;
      font-weight: 700;
      font-size: 1rem;
    }
    .result {
      margin-top: 8px;
      padding: 14px;
      border-radius: 8px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      font-weight: 700;
      color: #312e81;
      white-space: pre-line;
    }
    .result-small {
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.95;
    }
    .panel {
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      white-space: pre-line;
      font-weight: 600;
    }
    .panel-title {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
      opacity: 0.9;
    }
    .panel-phrase {
      background: #fef9c3;
      border-color: #fde047;
      color: #713f12;
    }
    .panel-lucky {
      background: #fee2e2;
      border-color: #ef4444;
      border-width: 2px;
      color: #991b1b;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15);
    }
    .panel-spell {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }
    .spell-list {
      margin-top: 8px;
      display: none;
      gap: 8px;
      flex-direction: column;
    }
    .spell-item {
      margin-top: 0;
    }
    .error {
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .hint {
      font-size: 0.84rem;
      color: #4b5563;
      margin-top: 4px;
      line-height: 1.5;
    }
    .settings {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
    }
    .settings h2 {
      font-size: 1rem;
      margin: 0 0 10px 0;
    }
    .settings-menu {
      display: grid;
      gap: 10px;
    }
    .settings-menu-btn {
      width: 100%;
      text-align: left;
      padding: 14px;
      border-radius: 8px;
      background: #fff;
      font-weight: 800;
    }
    .settings-menu-btn span {
      display: block;
      margin-top: 4px;
      color: #6b7280;
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .settings-view {
      display: none;
    }
    .settings-view.active {
      display: block;
    }
    .back-btn {
      margin-bottom: 10px;
    }
    .phrase-grid {
      display: grid;
      grid-template-columns: 52px 1fr 78px 22px;
      gap: 8px;
      max-height: 320px;
      overflow: auto;
      padding-right: 4px;
    }
    .phrase-label {
      font-size: 0.82rem;
      color: #374151;
      align-self: center;
      white-space: nowrap;
    }
    .phrase-input {
      font-size: 0.95rem;
      padding: 10px 10px;
    }
    .phrase-select {
      font-size: 0.82rem;
      padding: 8px 6px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
    }
    .auto-badge {
      align-self: center;
      justify-self: center;
      font-size: 0.64rem;
      font-weight: 700;
      color: #065f46;
      background: #d1fae5;
      border: 1px solid #6ee7b7;
      border-radius: 999px;
      padding: 1px 4px;
      display: inline-block;
      visibility: hidden;
    }
    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .stack-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      max-height: 58vh;
      overflow: auto;
      padding-right: 4px;
    }
    .stack-card {
      min-height: 82px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      display: grid;
      grid-template-rows: auto 1fr;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.08);
    }
    .stack-card.red {
      color: #dc2626;
    }
    .stack-position {
      font-size: 0.72rem;
      color: #6b7280;
      font-weight: 700;
    }
    .stack-card.red .stack-position {
      color: #b91c1c;
    }
    .stack-face {
      align-self: center;
      justify-self: center;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      display: grid;
      gap: 4px;
    }
    .stack-suit {
      font-size: 1.45rem;
    }
    .stack-rank {
      font-size: 1rem;
    }
    .import-input {
      display: none;
    }
    .settings-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn {
      min-width: 64px;
      height: 42px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0 12px;
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-btn {
      min-height: 44px;
      font-weight: 800;
      border-radius: 999px;
    }
    .mode-btn.active {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }
    .input-view {
      display: none;
    }
    .input-view.active {
      display: grid;
    }
    .sequence-view {
      gap: 14px;
    }
    .sequence-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sequence-title {
      font-size: 1rem;
      font-weight: 900;
    }
    .sequence-picked {
      font-size: 0.92rem;
      color: #4b5563;
      font-weight: 700;
    }
    .sequence-result {
      display: none;
      gap: 8px;
      margin-top: 8px;
      font-weight: 900;
    }
    .sequence-result-panel {
      margin-top: 0;
      text-align: center;
    }
    .sequence-result-blue {
      padding: 12px;
      border-radius: 8px;
      background: #eef2ff;
      border: 2px solid #818cf8;
      color: #312e81;
      white-space: pre-line;
      opacity: 0.92;
    }
    .sequence-result .result-card {
      display: block;
      font-size: 1.45rem;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .sequence-result .result-main {
      display: block;
      font-size: 1.85rem;
      line-height: 1.05;
    }
    .sequence-result .result-sub {
      display: block;
      font-size: 0.95rem;
      margin-top: 6px;
    }
    .sequence-result .panel-lucky {
      font-size: clamp(1.35rem, 5vw, 2.45rem);
      line-height: 1.2;
    }
    .sequence-result .panel-phrase {
      font-size: clamp(1.2rem, 4.5vw, 2.05rem);
      line-height: 1.25;
    }
    .sequence-result .panel-spell {
      font-size: clamp(1.1rem, 4vw, 1.8rem);
      line-height: 1.25;
    }
    .sequence-picker {
      min-height: 58vh;
    }
    #sequenceInputView .picker-row {
      display: none;
    }
    #sequenceInputView.sequence-phase-suit #sequenceSuitButtons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(140px, 1fr));
      gap: 10px;
    }
    #sequenceInputView.sequence-phase-rank #sequenceRankButtons1,
    #sequenceInputView.sequence-phase-rank #sequenceRankButtons2 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    #sequenceInputView.sequence-phase-rank #sequenceRankButtons3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      max-width: none;
    }
    #sequenceInputView .suit-row .pick-btn {
      min-height: min(34vh, 230px);
      font-size: clamp(4.5rem, 18vw, 9rem);
      line-height: 1;
    }
    #sequenceInputView .rank-row-5 .pick-btn,
    #sequenceInputView .rank-row-3 .pick-btn {
      min-height: 96px;
      font-size: clamp(2.25rem, 8vw, 4.6rem);
      line-height: 1;
    }
    #sequenceInputView .card-chip {
      display: none;
    }
    #sequenceInputView.sequence-phase-result .sequence-picker {
      display: none;
    }
    #sequenceInputView.sequence-phase-result .sequence-result {
      display: grid;
      margin-top: 12px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #111827;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover {
      background: #f3f4f6;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-card {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(17, 24, 39, 0.25);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .modal-head h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .cut-instruction {
      margin-top: 12px;
      white-space: pre-line;
      font-weight: 650;
      color: #111827;
    }
    .cut-note-red {
      color: #dc2626;
      font-weight: 800;
    }
    .cut-pos-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .cut-pos-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #111827;
      border-radius: 10px;
      padding: 10px 0;
      font-weight: 800;
      cursor: pointer;
    }
    .cut-pos-btn.active {
      background: #e0e7ff;
      border-color: #6366f1;
      color: #312e81;
    }
    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }
      .cut-pos-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .row3 {
        grid-template-columns: 1fr;
      }
      .sequence-result .result-main {
        font-size: 2.2rem;
      }
      #sequenceInputView.sequence-phase-suit #sequenceSuitButtons {
        grid-template-rows: repeat(2, minmax(120px, 1fr));
      }
      #sequenceInputView .suit-row .pick-btn {
        min-height: 120px;
      }
      #sequenceInputView .rank-row-5 .pick-btn,
      #sequenceInputView .rank-row-3 .pick-btn {
        min-height: 78px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="version">Version v1.0.32</div>
    <div class="header">
      <h1>True Cut</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="refresh-btn" type="button" aria-label="更新">更新</button>
        <button id="openCutGuideBtn" class="refresh-btn" type="button" aria-label="指定→カット">指定→カット</button>
        <button id="openSettingsBtn" class="settings-btn" type="button" aria-label="設定">⚙</button>
      </div>
    </div>

    <div class="mode-tabs" role="group" aria-label="入力方法">
      <button id="standardModeBtn" class="mode-btn active" type="button">同時入力</button>
      <button id="sequenceModeBtn" class="mode-btn" type="button">順番入力</button>
    </div>

    <section id="standardInputView" class="grid input-view active">
      <div class="row">
        <div>
          <label for="bottomSuit">ボトムカード</label>
          <div class="card-picker">
            <div id="bottomSuitButtons" class="picker-row suit-row"></div>
            <div id="bottomRankButtons1" class="picker-row rank-row-5"></div>
            <div id="bottomRankButtons2" class="picker-row rank-row-5"></div>
            <div id="bottomRankButtons3" class="picker-row rank-row-3"></div>
            <input id="bottomCardCode" type="hidden" />
            <div id="bottomCard" class="card-chip"></div>
          </div>
        </div>
        <div>
          <label for="targetSuit">選ばれたカード</label>
          <div class="card-picker">
            <div id="targetSuitButtons" class="picker-row suit-row"></div>
            <div id="targetRankButtons1" class="picker-row rank-row-5"></div>
            <div id="targetRankButtons2" class="picker-row rank-row-5"></div>
            <div id="targetRankButtons3" class="picker-row rank-row-3"></div>
            <input id="targetCardCode" type="hidden" />
            <div id="targetCard" class="card-chip"></div>
          </div>
        </div>
      </div>

      <div id="luckyPanel" class="panel panel-lucky" style="display:none;"></div>
      <div id="spellList" class="spell-list"></div>
      <div id="phrasePanel" class="panel panel-phrase" style="display:none;"></div>
      <div id="basePanel" class="result result-small"></div>
      <div id="error" class="error" style="display:none;"></div>
    </section>

    <section id="sequenceInputView" class="grid input-view sequence-view">
      <div class="sequence-head">
        <div>
          <div id="sequenceTitle" class="sequence-title">ボトムカード</div>
          <div id="sequencePicked" class="sequence-picked">未選択</div>
        </div>
        <button id="sequenceResetBtn" type="button">やり直す</button>
      </div>
      <div class="card-picker sequence-picker">
        <div id="sequenceSuitButtons" class="picker-row suit-row"></div>
        <div id="sequenceRankButtons1" class="picker-row rank-row-5"></div>
        <div id="sequenceRankButtons2" class="picker-row rank-row-5"></div>
        <div id="sequenceRankButtons3" class="picker-row rank-row-3"></div>
        <input id="sequenceCardCode" type="hidden" />
        <div id="sequenceCard" class="card-chip"></div>
      </div>
      <div id="sequenceResult" class="sequence-result"></div>
    </section>
  </main>

  <div id="cutGuideModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2>指定→カット（事前計算）</h2>
        <button id="closeCutBtn" type="button">閉じる</button>
      </div>
      <section class="settings">
          <p class="hint">このモーダル内で指定した「カード」が、指定の枚数目に来るように、カットする場所を計算します。</p>

          <div>
            <label>指定するカード</label>
            <div class="card-picker">
              <div id="guideTargetSuitButtons" class="picker-row suit-row"></div>
              <div id="guideTargetRankButtons1" class="picker-row rank-row-5"></div>
              <div id="guideTargetRankButtons2" class="picker-row rank-row-5"></div>
              <div id="guideTargetRankButtons3" class="picker-row rank-row-3"></div>
              <input id="guideTargetCardCode" type="hidden" />
              <div id="guideTargetCard" class="card-chip"></div>
            </div>
          </div>

        <div class="row" style="grid-template-columns: 1fr;">
          <div>
            <label for="cutDesiredPositionSelect">指定された枚数目（1〜52）</label>
            <select id="cutDesiredPositionSelect"></select>
          </div>
        </div>

        <div id="cutInstructionText" class="cut-instruction" style="display:none;"></div>
      </section>
    </div>
  </div>

  <div id="settingsModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="settingsTitle">設定</h2>
        <button id="closeSettingsBtn" type="button">閉じる</button>
      </div>
      <section id="settingsMenu" class="settings settings-view active">
        <div class="settings-menu">
          <button id="openPhraseSettingsBtn" class="settings-menu-btn" type="button">
            演出フレーズ設定
            <span>1〜52枚目ごとの表示フレーズを編集します。</span>
          </button>
          <button id="openStackViewBtn" class="settings-menu-btn" type="button">
            スタック閲覧
            <span>Mnemonicaの並びを上から順番に確認します。</span>
          </button>
        </div>
      </section>
      <section id="phraseSettingsView" class="settings settings-view">
        <button id="backToSettingsMenuFromPhraseBtn" class="back-btn" type="button">← 設定に戻る</button>
        <p class="hint">各枚数に対して表示したいフレーズを設定できます。未設定なら枚数のみ表示します。</p>
        <div id="phraseGrid" class="phrase-grid"></div>
        <div class="settings-actions">
          <button id="savePhrasesBtn" type="button">フレーズを保存</button>
          <button id="clearPhrasesBtn" type="button">フレーズを全消去</button>
          <button id="exportPhrasesBtn" type="button">JSONエクスポート</button>
          <button id="importPhrasesBtn" type="button">JSONインポート</button>
          <input id="importPhrasesFile" class="import-input" type="file" accept="application/json,.json" />
        </div>
      </section>
      <section id="stackView" class="settings settings-view">
        <button id="backToSettingsMenuFromStackBtn" class="back-btn" type="button">← 設定に戻る</button>
        <p class="hint">上から1枚目が♣4、52枚目が♦9です。</p>
        <div id="stackGrid" class="stack-grid"></div>
      </section>
    </div>
  </div>

  <script>
    const standardModeBtn = document.getElementById("standardModeBtn");
    const sequenceModeBtn = document.getElementById("sequenceModeBtn");
    const standardInputView = document.getElementById("standardInputView");
    const sequenceInputView = document.getElementById("sequenceInputView");
    const sequenceTitle = document.getElementById("sequenceTitle");
    const sequencePicked = document.getElementById("sequencePicked");
    const sequenceResetBtn = document.getElementById("sequenceResetBtn");
    const sequenceSuitButtons = document.getElementById("sequenceSuitButtons");
    const sequenceRankButtons1 = document.getElementById("sequenceRankButtons1");
    const sequenceRankButtons2 = document.getElementById("sequenceRankButtons2");
    const sequenceRankButtons3 = document.getElementById("sequenceRankButtons3");
    const sequenceCardCode = document.getElementById("sequenceCardCode");
    const sequenceCardInput = document.getElementById("sequenceCard");
    const sequenceResult = document.getElementById("sequenceResult");
    const bottomCardInput = document.getElementById("bottomCard");
    const targetCardInput = document.getElementById("targetCard");
    const bottomCardCode = document.getElementById("bottomCardCode");
    const targetCardCode = document.getElementById("targetCardCode");
    const bottomSuitButtons = document.getElementById("bottomSuitButtons");
    const bottomRankButtons1 = document.getElementById("bottomRankButtons1");

    function fromCompactCard(compact) {
      const normalized = (compact || "").trim().toUpperCase();
      const suit = normalized.slice(-1);
      const rank = normalized.slice(0, -1);
      return `${suit}-${rank}`;

    function normalizeCard(raw) {
      const value = (raw || "").trim().toUpperCase();
      const match = value.match(/^([SHDC])[-\s]?([A2-9]|10|J|Q|K)$/);
      if (!match) {
        return null;
      }
      const suit = match[1];
      const rank = match[2];
      if (!SUITS.has(suit) || !RANKS.has(rank)) {
        return null;
      }
      return `${suit}-${rank}`;
    }

    function calculatePosition(deck, bottomCard, targetCard) {
      const indexMap = new Map(deck.map((card, idx) => [card, idx]));
      if (!indexMap.has(bottomCard)) {
        return { error: `一番下カード ${bottomCard} は初期配列に存在しません。` };
      }
      if (!indexMap.has(targetCard)) {
        return { error: `探したいカード ${targetCard} は初期配列に存在しません。` };
      }

      const b = indexMap.get(bottomCard);
      const t = indexMap.get(targetCard);
      const position = ((t - b - 1 + 52) % 52) + 1;
      return { position };
    }

    function sumDigits(numberValue) {
      return String(numberValue)
        .split("")
        .map((ch) => Number(ch))
        .reduce((acc, cur) => acc + cur, 0);
    }

    function rankToNumber(rank) {
      if (rank === "A") {
        return 1;
      }
      if (rank === "J") {
        return 11;
      }
      if (rank === "Q") {
        return 12;
      }
      if (rank === "K") {
        return 13;
      }
      return Number(rank);
    }

    function getLuckyPatternMatches(position, orientation) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const hour24 = now.getHours();
      const minute = now.getMinutes();
      const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
      const matches = [];
      const directionTag = orientation === "front" ? "【おもて向き】" : "【うら向き】";
      const timeText = `${hour24}:${String(minute).padStart(2, "0")}`;
      const seconds = now.getSeconds();
      const remainSeconds = 60 - seconds;
      const activeSuffix = `\n（終了まであと${remainSeconds}秒）`;

      if (minute === position) {
        matches.push(`「今の${timeText}なので${position}枚目」${directionTag}${activeSuffix}`);
      }

      if (hour12 === position) {
        matches.push(`「今は ${hour12}時台なので${position}枚目」${directionTag}`);
      }

      if (hour12 + minute === position) {
        matches.push(`「今は${hour12}時${minute}分なので、足して${position}枚目」${directionTag}${activeSuffix}`);
      }
      if (hour24 + minute === position && hour24 !== hour12) {
        matches.push(`「今は${hour24}時${minute}分なので、足して${position}枚目」${directionTag}${activeSuffix}`);
      }

      if (day === position) {
        matches.push(`「今日は${day}日ですので、${position}枚目」${directionTag}`);
      }

      const monthDayConcat = Number(`${month}${day}`);
      if (monthDayConcat === position) {
        matches.push(`「今日は${month}月${day}日なので${position}枚目」${directionTag}`);
      } else {
        const monthDayDigitSum = sumDigits(monthDayConcat);
        if (monthDayDigitSum === position) {
          const expanded = `${String(monthDayConcat).split("").join("＋")}`;
          matches.push(`「今日は${month}月${day}日なので${expanded}で${position}枚目」${directionTag}`);
        }
      }
      const monthPlusDay = month + day;
      if (monthPlusDay === position) {
        matches.push(`「今日は${month}月${day}日なので${month}＋${day}で${position}枚目」${directionTag}`);
      }

      const yearMonthDayDigits = `${year}${month}${day}`;
      const yearMonthDayDigitSum = sumDigits(yearMonthDayDigits);
      if (yearMonthDayDigitSum === position) {
        const expanded = yearMonthDayDigits.split("").join("＋");
        matches.push(`「今日は${year}年${month}月${day}日なので${expanded}で${position}枚目」${directionTag}`);
      }

      return matches;
    }

    function getUpcomingLuckyHints(position, orientation) {
      const now = new Date();
      const seconds = now.getSeconds();
      const waitSeconds = 60 - seconds;
      if (waitSeconds <= 0 || waitSeconds > 30) {
        return [];
      }

      const next = new Date(now.getTime() + waitSeconds * 1000);
      const year = next.getFullYear();
      const month = next.getMonth() + 1;
      const day = next.getDate();
      const hour24 = next.getHours();
      const minute = next.getMinutes();
      const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
      const directionTag = orientation === "front" ? "【おもて向き】" : "【うら向き】";
      const timeText = `${hour24}:${String(minute).padStart(2, "0")}`;
      const pendingSuffix = `\n（有効まであと${waitSeconds}秒）`;
      const hints = [];

      if (minute === position) {
        hints.push(`「あと${waitSeconds}秒で${timeText}。${position}分になるので${position}枚目」${directionTag}${pendingSuffix}`);
      }
      if (hour12 === position) {
        hints.push(`「あと${waitSeconds}秒で${hour12}時台。${position}枚目」${directionTag}`);
      }
      if (hour12 + minute === position) {
        hints.push(`「あと${waitSeconds}秒で${hour12}時${minute}分。足して${position}枚目」${directionTag}${pendingSuffix}`);
      }
      if (hour24 + minute === position && hour24 !== hour12) {
        hints.push(`「あと${waitSeconds}秒で${hour24}時${minute}分。足して${position}枚目」${directionTag}${pendingSuffix}`);
      }
      // 30秒予告は時刻系のみを対象にする（日付系は実戦上ほぼ変化しないため除外）

      return hints;
    }

    function getSpellPatternMatches(cardCode, position, orientation) {
      const [suit, rank] = cardCode.split("-");
      const suitReadings = SUIT_READINGS[suit] || [];
      const rankReadings = RANK_READINGS[rank] || [rank];
      const rankNumber = rankToNumber(rank);
      const directionTag = orientation === "front" ? "【おもて向き】" : "【うら向き】";
      const matches = [];
      const dedupe = new Set();

      // パターン1: 「スートのランク」を文字どおり配る（"の"は必須）
      // position は「その向きでの何枚目」か（裏=上から数えた枚数、表=表向き換算）
      for (const suitWord of suitReadings) {
        for (const rankWord of rankReadings) {
          const phrase = `${suitWord}の${rankWord}`;
          if (phrase.length === position) {
            const msg = `「${phrase}」と文字どおり配る（${position}枚目）${directionTag}`;
            if (!dedupe.has(msg)) {
              dedupe.add(msg);
              matches.push(msg);
            }
          }
        }
      }

      // パターン2: 「スート名＋ランク枚配る」→ 実際に配る枚数は（スート読みの文字数 + ランク）
      // 例: スペード(4文字)＋7 → 11枚。ランクそのもの枚ではない。
      for (const suitWord of suitReadings) {
        const dealCount = suitWord.length + rankNumber;
        if (dealCount === position) {
          const msg = `「${suitWord}＋${rankNumber}枚配る（${suitWord.length}＋${rankNumber}＝${dealCount}枚）${directionTag}`;
          if (!dedupe.has(msg)) {
            dedupe.add(msg);
            matches.push(msg);
          }
        }
      }

      // パターン3: 「カードの数字そのもの」が枚数に一致
      // 例: ♣5 が 5枚目なら「♣の5なので5枚目のカード」。
      if (rankNumber === position) {
        const msg = `「${SUIT_SYMBOLS[suit]}の${rank}なので${position}枚目のカード」${directionTag}`;
        if (!dedupe.has(msg)) {
          dedupe.add(msg);
          matches.push(msg);
        }
      }

      return matches;
    }

    function getPhraseState() {
      const raw = localStorage.getItem(PHRASE_STORAGE_KEY);
      const empty = {};
      for (let i = 1; i <= 52; i += 1) {
        empty[String(i)] = { text: "", orientation: "back", autoFrom: null };
      }
      if (!raw) {
        return empty;
      }
      try {
        const data = JSON.parse(raw);
        // backward compatibility: old format {"1":"text", ...}
        if (!data || typeof data !== "object") {
          return empty;
        }
        if (!data["1"] || typeof data["1"] === "string") {
          for (let i = 1; i <= 52; i += 1) {
            const key = String(i);
            const text = typeof data[key] === "string" ? data[key].trim() : "";
            empty[key] = { text, orientation: "back", autoFrom: null };
          }
          return empty;
        }
        for (let i = 1; i <= 52; i += 1) {
          const key = String(i);
          const entry = data[key] || {};
          empty[key] = {
            text: typeof entry.text === "string" ? entry.text.trim() : "",
            orientation: entry.orientation === "front" ? "front" : "back",
            autoFrom: Number.isInteger(entry.autoFrom) ? entry.autoFrom : null
          };
        }
        return empty;
      } catch {
        return empty;
      }
    }

    function setPhraseState(state) {
      localStorage.setItem(PHRASE_STORAGE_KEY, JSON.stringify(state));
    }

    function getMirrorPosition(position) {
      return 53 - position;
    }

    function savePhrases() {
      const state = collectPhraseStateFromInputs();
      setPhraseState(state);
      render();
    }

    function collectPhraseStateFromInputs() {
      const state = {};
      for (const input of getPhraseInputs()) {
        const key = input.dataset.position;
        const select = document.getElementById(`phrase-orientation-${key}`);
        const autoFrom = Number(input.dataset.autoFrom || 0);
        state[key] = {
          text: input.value.trim(),
          orientation: select && select.value === "front" ? "front" : "back",
          autoFrom: autoFrom > 0 ? autoFrom : null
        };
      }
      return state;
    }

    function exportPhrases() {
      const phraseState = collectPhraseStateFromInputs();
      const payload = {
        app: "True Cut",
        type: "phrase-settings",
        version: 2,
        exportedAt: new Date().toISOString(),
        phrases: phraseState
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      a.href = url;
      a.download = `true-cut-phrases-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importPhrasesFromObject(data) {
      const source = data && typeof data === "object" ? data.phrases || data : {};
      if (!source || typeof source !== "object") {
        throw new Error("JSONの形式が正しくありません");
      }

      const normalized = {};
      for (let i = 1; i <= 52; i += 1) {
        const key = String(i);
        const value = source[key];
        if (typeof value === "string") {
          normalized[key] = { text: value.trim(), orientation: "back", autoFrom: null };
          continue;
        }
        normalized[key] = {
          text: value && typeof value.text === "string" ? value.text.trim() : "",
          orientation: value && value.orientation === "front" ? "front" : "back",
          autoFrom: value && Number.isInteger(value.autoFrom) ? value.autoFrom : null
        };
      }
      setPhraseState(normalized);
      applyPhrasesToInputs();
      render();
    }

    function loadPhrases() {
      return getPhraseState();
    }

    function applyPhrasesToInputs() {
      const phrases = loadPhrases();
      for (const input of getPhraseInputs()) {
        const key = input.dataset.position;
        const entry = phrases[key] || { text: "", orientation: "back", autoFrom: null };
        input.value = entry.text || "";
        input.dataset.autoFrom = entry.autoFrom ? String(entry.autoFrom) : "";
        const select = document.getElementById(`phrase-orientation-${key}`);
        if (select) {
          select.value = entry.orientation === "front" ? "front" : "back";
        }
        const badge = document.getElementById(`phrase-auto-${key}`);
        if (badge) {
          badge.style.visibility = entry.autoFrom ? "visible" : "hidden";
        }
      }
    }

    function updatePhraseAutoLink(sourcePos) {
      const sourceInput = document.getElementById(`phrase-input-${sourcePos}`);
      const sourceSelect = document.getElementById(`phrase-orientation-${sourcePos}`);
      if (!sourceInput || !sourceSelect) {
        return;
      }
      sourceInput.dataset.autoFrom = "";
      const sourceText = sourceInput.value.trim();
      const mirrorPos = getMirrorPosition(sourcePos);
      const mirrorInput = document.getElementById(`phrase-input-${mirrorPos}`);
      const mirrorSelect = document.getElementById(`phrase-orientation-${mirrorPos}`);
      const mirrorBadge = document.getElementById(`phrase-auto-${mirrorPos}`);
      if (!mirrorInput || !mirrorSelect || !mirrorBadge) {
        return;
      }

      const mirrorAutoFrom = Number(mirrorInput.dataset.autoFrom || 0);
      const mirrorText = mirrorInput.value.trim();
      const shouldAutoFill = sourceText && (mirrorText === "" || mirrorAutoFrom === sourcePos);
      if (shouldAutoFill) {
        mirrorInput.value = sourceText;
        mirrorInput.dataset.autoFrom = String(sourcePos);
        mirrorSelect.value = sourceSelect.value === "back" ? "front" : "back";
        mirrorBadge.style.visibility = "visible";
      } else if (mirrorAutoFrom === sourcePos && !sourceText) {
        mirrorInput.value = "";
        mirrorInput.dataset.autoFrom = "";
        mirrorSelect.value = "back";
        mirrorBadge.style.visibility = "hidden";
      }

      const sourceBadge = document.getElementById(`phrase-auto-${sourcePos}`);
      if (sourceBadge) {
        sourceBadge.style.visibility = "hidden";
      }
    }

    function detachPhraseAuto(pos) {
      const input = document.getElementById(`phrase-input-${pos}`);
      const badge = document.getElementById(`phrase-auto-${pos}`);
      if (input && input.dataset.autoFrom) {
        input.dataset.autoFrom = "";
        if (badge) {
          badge.style.visibility = "hidden";
        }
      }
    }

    function buildButtonRow(container, values, getCurrent, onPick, isSuit = false) {
      container.innerHTML = "";
      for (const value of values) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pick-btn";
        if (isSuit) {
          btn.classList.add("suit-btn");
        }
        btn.textContent = isSuit ? SUIT_SYMBOLS[value] : value;
        if (isSuit && (value === "H" || value === "D")) {
          btn.classList.add("red");
        }
        if (value === getCurrent()) {
          btn.classList.add("active");
        }
        btn.addEventListener("click", () => onPick(value));
        container.appendChild(btn);
      }
    }

    function syncGuideTargetPickers() {
      buildButtonRow(guideTargetSuitButtons, SUIT_ROWS, () => guideTargetSuitValue, (value) => {
        guideTargetSuitValue = value;
        syncGuideTargetPickers();
      }, true);

      buildButtonRow(guideTargetRankButtons1, RANK_ROWS[0], () => guideTargetRankValue, (value) => {
        guideTargetRankValue = value;
        syncGuideTargetPickers();
      });
      buildButtonRow(guideTargetRankButtons2, RANK_ROWS[1], () => guideTargetRankValue, (value) => {
        guideTargetRankValue = value;
        syncGuideTargetPickers();
      });
      buildButtonRow(guideTargetRankButtons3, RANK_ROWS[2], () => guideTargetRankValue, (value) => {
        guideTargetRankValue = value;
        syncGuideTargetPickers();
      });

      setCardDisplay(guideTargetSuitValue, guideTargetRankValue, guideTargetCardCode, guideTargetCardInput);
      updateCutInstruction();
    }

    function render() {
      clearError();
      const bottom = getCardCode(bottomCardCode);
      const target = getCardCode(targetCardCode);

      if (!bottom || !target) {
        basePanelEl.textContent = "ボトムカードと選ばれたカードを選んでください";
        luckyPanelEl.style.display = "none";
        spellListEl.style.display = "none";
        spellListEl.innerHTML = "";
        phrasePanelEl.style.display = "none";
        phrasePanelEl.textContent = "";
        return;
      }

      const calc = calculatePosition(ACTIVE_DECK, bottom, target);
      if (calc.error) {
        showError(calc.error);
        return;
      }
      const phrases = loadPhrases();
      const phraseEntry = phrases[String(calc.position)] || { text: "", orientation: "back" };
      const phrase = phraseEntry.text || "";
      const backPosition = calc.position;
      const facePosition = 53 - calc.position;
      const luckyMatches = [
        ...getLuckyPatternMatches(backPosition, "back"),
        ...getLuckyPatternMatches(facePosition, "front")
      ];
      const upcomingHints = [
        ...getUpcomingLuckyHints(backPosition, "back"),
        ...getUpcomingLuckyHints(facePosition, "front")
      ];
      const spellMatches = [
        ...getSpellPatternMatches(target, backPosition, "back"),
        ...getSpellPatternMatches(target, facePosition, "front")
      ];

      const line1 = `${formatCardForDisplay(target)} は上から ${backPosition} 枚目（表向き: ${facePosition} 枚目）`;
      basePanelEl.textContent = line1;

      if (luckyMatches.length > 0) {
        luckyPanelEl.style.display = "block";
        luckyPanelEl.textContent = luckyMatches.join("\n");
      } else if (upcomingHints.length > 0) {
        luckyPanelEl.style.display = "block";
        luckyPanelEl.textContent = upcomingHints.join("\n");
      } else {
        luckyPanelEl.style.display = "none";
        luckyPanelEl.textContent = "";
      }

      if (spellMatches.length > 0) {
        spellListEl.style.display = "flex";
        spellListEl.innerHTML = "";
        for (const match of spellMatches) {
          const item = document.createElement("div");
          item.className = "panel panel-spell spell-item";
          item.textContent = match;
          spellListEl.appendChild(item);
        }
      } else {
        spellListEl.style.display = "none";
        spellListEl.innerHTML = "";
      }

      if (phrase) {
        phrasePanelEl.style.display = "block";
        const orient = phraseEntry.orientation === "front" ? "【おもて向き】" : "【うら向き】";
        phrasePanelEl.textContent = `「${phrase}」${orient}`;
      } else {
        phrasePanelEl.style.display = "none";
        phrasePanelEl.textContent = "";
      }
    }

    function openSettings() {
      showSettingsView("menu");
      settingsModal.classList.add("show");
      settingsModal.setAttribute("aria-hidden", "false");
    }

    function closeSettings() {
      settingsModal.classList.remove("show");
      settingsModal.setAttribute("aria-hidden", "true");
    }

    function showSettingsView(viewName) {
      const views = [settingsMenu, phraseSettingsView, stackView];
      for (const view of views) {
        if (view) {
          view.classList.remove("active");
        }
      }

      if (viewName === "phrase") {
        settingsTitle.textContent = "演出フレーズ設定";
        phraseSettingsView.classList.add("active");
        return;
      }

      if (viewName === "stack") {
        settingsTitle.textContent = "スタック閲覧";
        renderStackDeck();
        stackView.classList.add("active");
        return;
      }

      settingsTitle.textContent = "設定";
      settingsMenu.classList.add("active");
    }

    function renderStackDeck() {
      if (!stackGrid || stackGrid.childElementCount > 0) {
        return;
      }
      ACTIVE_DECK.forEach((cardCode, index) => {
        const [suit, rank] = cardCode.split("-");
        const cardEl = document.createElement("div");
        cardEl.className = "stack-card";
        if (suit === "H" || suit === "D") {
          cardEl.classList.add("red");
        }

        const positionEl = document.createElement("div");
        positionEl.className = "stack-position";
        positionEl.textContent = String(index + 1);

        const faceEl = document.createElement("div");
        faceEl.className = "stack-face";
        const suitEl = document.createElement("div");
        suitEl.className = "stack-suit";
        suitEl.textContent = SUIT_SYMBOLS[suit];

        const rankEl = document.createElement("div");
        rankEl.className = "stack-rank";
        rankEl.textContent = rank;

        faceEl.append(suitEl, rankEl);
        cardEl.append(positionEl, faceEl);
        stackGrid.appendChild(cardEl);
      });
    }

    function setInputMode(mode) {
      const isSequence = mode === "sequence";
      standardModeBtn.classList.toggle("active", !isSequence);
      sequenceModeBtn.classList.toggle("active", isSequence);
      standardInputView.classList.toggle("active", !isSequence);
      sequenceInputView.classList.toggle("active", isSequence);
      if (isSequence) {
        resetSequenceInput();
      }
    }

    function resetSequenceInput() {
      sequenceStep = "bottomSuit";
      sequenceSuitValue = "C";
      sequenceRankValue = "A";
      sequenceBottomCode = "";
      sequenceTargetCode = "";
      sequenceResult.style.display = "none";
      sequenceResult.innerHTML = "";
      syncSequencePickers();
    }

    function syncSequencePickers() {
      const isSuitStep = sequenceStep === "bottomSuit" || sequenceStep === "targetSuit";
      const isRankStep = sequenceStep === "bottomRank" || sequenceStep === "targetRank";
      const isResultStep = sequenceStep === "result";
      sequenceInputView.classList.toggle("sequence-phase-suit", isSuitStep);
      sequenceInputView.classList.toggle("sequence-phase-rank", isRankStep);
      sequenceInputView.classList.toggle("sequence-phase-result", isResultStep);

      if (sequenceStep === "bottomSuit") {
        sequenceTitle.textContent = "\u30dc\u30c8\u30e0\u30ab\u30fc\u30c9\u306e\u30de\u30fc\u30af";
        sequencePicked.textContent = "\u672a\u9078\u629e";
      } else if (sequenceStep === "bottomRank") {
        sequenceTitle.textContent = "\u30dc\u30c8\u30e0\u30ab\u30fc\u30c9\u306e\u6570\u5b57";
        sequencePicked.textContent = "\u30de\u30fc\u30af: " + SUIT_SYMBOLS[sequenceSuitValue];
      } else if (sequenceStep === "targetSuit") {
        sequenceTitle.textContent = "\u9078\u3070\u308c\u305f\u30ab\u30fc\u30c9\u306e\u30de\u30fc\u30af";
        sequencePicked.textContent = "\u30dc\u30c8\u30e0: " + formatCardForDisplay(sequenceBottomCode);
      } else if (sequenceStep === "targetRank") {
        sequenceTitle.textContent = "\u9078\u3070\u308c\u305f\u30ab\u30fc\u30c9\u306e\u6570\u5b57";
        sequencePicked.textContent = "\u30dc\u30c8\u30e0: " + formatCardForDisplay(sequenceBottomCode) + " / \u30de\u30fc\u30af: " + SUIT_SYMBOLS[sequenceSuitValue];
      } else {
        sequenceTitle.textContent = "\u7d50\u679c";
        sequencePicked.textContent = "\u30dc\u30c8\u30e0: " + formatCardForDisplay(sequenceBottomCode) + " / \u9078\u3070\u308c\u305f\u30ab\u30fc\u30c9: " + formatCardForDisplay(sequenceTargetCode);
      }

      buildButtonRow(sequenceSuitButtons, SUIT_ROWS, () => sequenceSuitValue, completeSequenceSuitPick, true);
      buildButtonRow(sequenceRankButtons1, RANK_ROWS[0], () => sequenceRankValue, completeSequenceRankPick);
      buildButtonRow(sequenceRankButtons2, RANK_ROWS[1], () => sequenceRankValue, completeSequenceRankPick);
      buildButtonRow(sequenceRankButtons3, RANK_ROWS[2], () => sequenceRankValue, completeSequenceRankPick);
      setCardDisplay(sequenceSuitValue, sequenceRankValue, sequenceCardCode, sequenceCardInput);
    }

    function completeSequenceSuitPick(value) {
      sequenceSuitValue = value;
      if (sequenceStep === "bottomSuit") {
        sequenceStep = "bottomRank";
        sequenceRankValue = "A";
      } else if (sequenceStep === "targetSuit") {
        sequenceStep = "targetRank";
        sequenceRankValue = "A";
      }
      syncSequencePickers();
    }

    function completeSequenceRankPick(value) {
      sequenceRankValue = value;
      const pickedCode = sequenceSuitValue + "-" + sequenceRankValue;
      setCardDisplay(sequenceSuitValue, sequenceRankValue, sequenceCardCode, sequenceCardInput);

      if (sequenceStep === "bottomRank") {
        sequenceBottomCode = pickedCode;
        bottomSuitValue = sequenceSuitValue;
        bottomRankValue = sequenceRankValue;
        sequenceStep = "targetSuit";
        sequenceSuitValue = "C";
        sequenceRankValue = "A";
        syncCardPickers();
        syncSequencePickers();
        render();
        return;
      }

      if (sequenceStep !== "targetRank") {
        return;
      }

      sequenceTargetCode = pickedCode;
      targetSuitValue = sequenceSuitValue;
      targetRankValue = sequenceRankValue;
      syncCardPickers();
      sequenceStep = "result";
      syncSequencePickers();
      render();
      renderSequenceResult();
    }

    function appendSequencePanel(className, text) {
      const panel = document.createElement("div");
      panel.className = className;
      panel.textContent = text;
      sequenceResult.appendChild(panel);
    }

    function renderSequenceResult() {
      const calc = calculatePosition(ACTIVE_DECK, sequenceBottomCode, sequenceTargetCode);
      sequenceResult.innerHTML = "";
      if (calc.error) {
        sequenceResult.style.display = "grid";
        appendSequencePanel("error sequence-result-panel", calc.error);
        return;
      }
      const backPosition = calc.position;
      const facePosition = 53 - calc.position;
      const phrases = loadPhrases();
      const phraseEntry = phrases[String(calc.position)] || { text: "", orientation: "back" };
      const phrase = phraseEntry.text || "";
      const luckyMatches = [
        ...getLuckyPatternMatches(backPosition, "back"),
        ...getLuckyPatternMatches(facePosition, "front")
      ];
      const upcomingHints = [
        ...getUpcomingLuckyHints(backPosition, "back"),
        ...getUpcomingLuckyHints(facePosition, "front")
      ];
      const spellMatches = [
        ...getSpellPatternMatches(sequenceTargetCode, backPosition, "back"),
        ...getSpellPatternMatches(sequenceTargetCode, facePosition, "front")
      ];

      sequenceResult.style.display = "grid";

      if (luckyMatches.length > 0) {
        appendSequencePanel("panel panel-lucky sequence-result-panel", luckyMatches.join("\n"));
      } else if (upcomingHints.length > 0) {
        appendSequencePanel("panel panel-lucky sequence-result-panel", upcomingHints.join("\n"));
      }

      if (phrase) {
        const orient = phraseEntry.orientation === "front" ? "\u3010\u304a\u3082\u3066\u5411\u304d\u3011" : "\u3010\u3046\u3089\u5411\u304d\u3011";
        appendSequencePanel("panel panel-phrase sequence-result-panel", "\u300c" + phrase + "\u300d" + orient);
      }

      for (const match of spellMatches) {
        appendSequencePanel("panel panel-spell sequence-result-panel", match);
      }

      const bluePanel = document.createElement("div");
      bluePanel.className = "sequence-result-blue sequence-result-panel";
      bluePanel.innerHTML =
        '<span class="result-card">' + formatCardForDisplay(sequenceTargetCode) + '</span>' +
        '<span class="result-main">\u4e0a\u304b\u3089 ' + backPosition + '</span>' +
        '<span class="result-sub">\u8868\u5411\u304d: ' + facePosition + ' / \u30dc\u30c8\u30e0: ' + formatCardForDisplay(sequenceBottomCode) + '</span>';
      sequenceResult.appendChild(bluePanel);
    }

    let pendingCutBottomCode = null;

    function fillCutPositionSelect() {
      if (!cutDesiredPositionSelect) return;
      cutDesiredPositionSelect.innerHTML = "";
      for (let i = 1; i <= 52; i += 1) {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = String(i);
        cutDesiredPositionSelect.appendChild(option);
      }
    }

    function updateCutInstruction() {
      if (!cutDesiredPositionSelect || !guideTargetCardCode || !cutInstructionText) return;
      const targetCode = guideTargetCardCode.value;
      const desiredPosition = Number(cutDesiredPositionSelect.value);

      if (!targetCode) {
        cutInstructionText.style.display = "none";
        cutInstructionText.textContent = "";
        return;
      }
      if (!Number.isInteger(desiredPosition) || desiredPosition < 1 || desiredPosition > 52) {
        cutInstructionText.style.display = "none";
        cutInstructionText.textContent = "";
        return;
      }

      const targetIndex = ACTIVE_DECK.indexOf(targetCode);
      if (targetIndex < 0) {
        cutInstructionText.style.display = "block";
        cutInstructionText.textContent = "指定するカードがデッキに存在しません。";
        return;
      }

      // このモードは「裏（上からN枚）」固定
      const backPositionWanted = desiredPosition;

      // rotate-left（上からmoveCount枚を下へ回す）すると、指定カードが上からbackPositionWanted枚目になる
      const moveCount = (targetIndex - backPositionWanted + 1 + 52) % 52;
      const bottomAfterIndex = (moveCount - 1 + 52) % 52;
      const bottomAfterCode = ACTIVE_DECK[bottomAfterIndex];
      const bottomAfterText = formatCardForDisplay(bottomAfterCode);
      const backCurrentPosition = targetIndex + 1;
      const frontCurrentPosition = 53 - backCurrentPosition;
      const isBackNoCutJust = backCurrentPosition === backPositionWanted;
      const isFrontNoCutJust = frontCurrentPosition === backPositionWanted;

      if (isBackNoCutJust) {
        cutInstructionText.style.display = "block";
        cutInstructionText.textContent =
          `✅ ジャスト（ノーカット）\n` +
          `ノーカット（そのまま）\n` +
          `ボトムは${bottomAfterText}`;
      } else {
        const lines = [
          `上から${moveCount}枚を下へ回す。`,
          `ボトムは${bottomAfterText}`
        ];
        if (isFrontNoCutJust) {
          cutInstructionText.style.display = "block";
          cutInstructionText.innerHTML =
            `${lines[0]}<br>${lines[1]}<br><span class="cut-note-red">※ おもて向きならノーカットでジャスト。</span>`;
          return;
        }
        cutInstructionText.style.display = "block";
        cutInstructionText.textContent = lines.join("\n");
      }
    }

    function openCutGuide() {
      if (!cutGuideModal) return;
      pendingCutBottomCode = null;
      cutInstructionText.style.display = "none";
      cutInstructionText.textContent = "";

      if (cutDesiredPositionSelect) {
        // デフォルトは1
        cutDesiredPositionSelect.value = "1";
      }

      // 既存画面の「選ばれたカード」をモーダル初期値として反映（必要ならそのまま変更可能）
      if (targetCardCode && targetCardCode.value) {
        const parts = targetCardCode.value.split("-");
        if (parts.length === 2) {
          guideTargetSuitValue = parts[0];
          guideTargetRankValue = parts[1];
          syncGuideTargetPickers();
        }
      }

      cutGuideModal.classList.add("show");
      cutGuideModal.setAttribute("aria-hidden", "false");
      cutGuideModal.style.display = "flex";

      // すぐ更新
      updateCutInstruction();
    }

    function closeCutGuide() {
      if (!cutGuideModal) return;
      cutGuideModal.classList.remove("show");
      cutGuideModal.setAttribute("aria-hidden", "true");
      // iOS端末で class 切替が効きづらいケースに備え、inlineで強制的に隠す
      cutGuideModal.style.display = "none";
    }

    // 指定→カット（事前計算）は updateCutInstruction() に統一（即時表示）
    fillCutPositionSelect();
    if (cutDesiredPositionSelect) {
      cutDesiredPositionSelect.addEventListener("change", () => updateCutInstruction());
    }
    buildPhraseInputs();
    applyPhrasesToInputs();
    for (const input of getPhraseInputs()) {
      input.addEventListener("input", () => {
        const pos = Number(input.dataset.position);
        if (!Number.isInteger(pos)) {
          return;
        }
        detachPhraseAuto(pos);
        updatePhraseAutoLink(pos);
        savePhrases();
      });
    }
    for (const select of getPhraseSelects()) {
      select.addEventListener("change", () => {
        const pos = Number(select.dataset.position);
        if (!Number.isInteger(pos)) {
          return;
        }
        detachPhraseAuto(pos);
        savePhrases();
      });
    }
    syncCardPickers();
    syncGuideTargetPickers();
    syncSequencePickers();
    savePhrasesBtn.addEventListener("click", savePhrases);
    clearPhrasesBtn.addEventListener("click", () => {
      const ok = confirm("フレーズ設定をすべて削除します。よろしいですか？");
      if (!ok) {
        return;
      }
      for (const input of getPhraseInputs()) {
        input.value = "";
        input.dataset.autoFrom = "";
      }
      for (const select of getPhraseSelects()) {
        select.value = "back";
      }
      for (let i = 1; i <= 52; i += 1) {
        const badge = document.getElementById(`phrase-auto-${i}`);
        if (badge) {
          badge.style.visibility = "hidden";
        }
      }
      localStorage.removeItem(PHRASE_STORAGE_KEY);
      render();
    });
    exportPhrasesBtn.addEventListener("click", exportPhrases);
    importPhrasesBtn.addEventListener("click", () => {
      importPhrasesFile.click();
    });
    importPhrasesFile.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        return;
      }
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        importPhrasesFromObject(data);
      } catch {
        alert("JSONの読み込みに失敗しました。ファイル内容を確認してください。");
      } finally {
        importPhrasesFile.value = "";
      }
    });
    standardModeBtn.addEventListener("click", () => setInputMode("standard"));
    sequenceModeBtn.addEventListener("click", () => setInputMode("sequence"));
    sequenceResetBtn.addEventListener("click", resetSequenceInput);
    openSettingsBtn.addEventListener("click", openSettings);
    openPhraseSettingsBtn.addEventListener("click", () => showSettingsView("phrase"));
    openStackViewBtn.addEventListener("click", () => showSettingsView("stack"));
    backToSettingsMenuFromPhraseBtn.addEventListener("click", () => showSettingsView("menu"));
    backToSettingsMenuFromStackBtn.addEventListener("click", () => showSettingsView("menu"));
    if (openCutGuideBtn) {
      openCutGuideBtn.addEventListener("click", openCutGuide);
    }
    if (closeCutBtn) {
      closeCutBtn.addEventListener("click", closeCutGuide);
    }
    if (cutGuideModal) {
      cutGuideModal.addEventListener("click", (event) => {
        if (event.target === cutGuideModal) {
          closeCutGuide();
        }
      });
    }
    refreshBtn.addEventListener("click", () => {
      const url = new URL(window.location.href);
      url.searchParams.set("v", String(Date.now()));
      window.location.replace(url.toString());
    });
    closeSettingsBtn.addEventListener("click", closeSettings);
    settingsModal.addEventListener("click", (event) => {
      if (event.target === settingsModal) {
        closeSettings();
      }
    });
    setInterval(render, 1000);

    render();
  </script>
</body>
</html>
